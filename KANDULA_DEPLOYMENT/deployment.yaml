---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: kandula
  name: deployment-kandula-app
  annotations:
    kubernetes.io/change-cause: "Release Kandula:v3.0.15.6296e49a"
  labels:
    version: v3.0.15.6296e49a
    task: Final-Project
    app: kandula
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
        maxUnavailable: 1
        maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kandula
  template:
    metadata:
      labels:
        version: v3.0.15.6296e49a
        app.kubernetes.io/name: kandula
    spec:
      containers:
        - name: kandula
          image: galitu/kandula-repo:kandula-final-prj-v3.0.15.6296e49a
          ports:
            - containerPort: 5000
              name: http
              protocol: TCP
          env:
            - name: FLASK_ENV
              value: development
          envFrom:
            - secretRef:
                name: kandula-secrets
