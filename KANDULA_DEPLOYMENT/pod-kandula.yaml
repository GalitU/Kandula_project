apiVersion: v1
kind: Pod
metadata:
  name: kandula-pod
  labels:
    app: backend
spec:
  containers:
    - image: galitu/kandula-repo:kandula-mid-prj-v3.0.21.786d20ff
      name: kandula
      ports:
        - containerPort: 5000
          name: http
          protocol: TCP
      env:
        - name: FLASK_ENV
          value: development

      envFrom:
        - secretRef:
            name: kandula-secrets
