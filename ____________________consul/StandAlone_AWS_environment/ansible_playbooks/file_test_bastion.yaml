- hosts: tag_Name_Alone_Consul_ConsulSrvAnsible_Ubuntu_0

  tasks:
    - name: example
      debug:
        msg: This message will be printer on ec2 in private subnet at IP DNS name = {{ inventory_hostname }}!

    - name: example
      debug:
        msg: This message will be printer on ec2 in private subnet at IP address = {{ private_  ip_address }}!

    - name: get my public IP
      ipify_facts: api_url=http://api.ipify.org
      connection: local

    - name: Obtain local IP address
      local_action: shell ip route get {{ inventory_hostname }} | awk '{ for (x=1;x<=NF;x++) if ($x=="src") print $(x+1) }'
      register: local_address
      changed_when: false

    - name: Print my local address
      debug: msg="Source address towards {{ inventory_hostname }} is {{ local_address.stdout }}"
