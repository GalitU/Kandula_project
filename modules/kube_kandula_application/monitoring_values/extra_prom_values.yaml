- job_name: consul_node_exporter
  scrape_interval: 5s
  scrape_timeout: 5s
  consul_sd_configs:
    - server: "consul.galitu.site"
      scheme: https
      datacenter: "galit_dc_kandula"
  relabel_configs:
    - source_labels: ["__address__"]
      target_label: "__address__"
      regex: "(.*):(.*)"
      replacement: "$1:9100"
    - source_labels: ["__meta_consul_node"]
      target_label: "instance"
    - source_labels: ["__meta_consul_node"]
      regex: "k8s-sync"
      action:
        drop
        #- source_labels: [ '__meta_consul_tags' ]
        #regex: .*,monitor,.*
        #action: 'keep'
        #target_label: '__meta_consul_service_port'

