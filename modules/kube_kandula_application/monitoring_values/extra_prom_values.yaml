- job_name: kandula_by_web_address
  scrape_interval: 5s
  static_configs:
    - targets: ["kandula.galitu.site"]
  metrics_path: /metrics
  scheme: https

- job_name: "Jenkins"
  metrics_path: "/prometheus/"
  static_configs:
    - targets: ["jenkins.galitu.site"]
  scheme: https
  metric_relabel_configs:
