---
# This playbook will Setup and install consul for server * 3 and all relevant Consul agents

- name: Install Jenkins Servers
  hosts: tag_Purpose_JenkinsSrv
  become: true
  remote_user: ubuntu
  vars:
    CONSUL_TEMPLATE_FILE_TYPE: "jenkins_server"
  roles:
    - role: jenkins


- name: Install Jenkins Slaves
  hosts: tag_Purpose_JenkinsSlave
  become: true
  remote_user: ubuntu
  vars:
    CONSUL_TEMPLATE_FILE_TYPE: "jenkins_agent"
  roles:
    - role: jenkins
