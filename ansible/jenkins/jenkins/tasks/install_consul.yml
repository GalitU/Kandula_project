---
- name: Unarchive a consul zip file to /usr/local/bin
  ansible.builtin.unarchive:
    src: https://releases.hashicorp.com/consul/{{CONSUL_VERSION}}/consul_{{CONSUL_VERSION}}_linux_amd64.zip
    dest: /usr/local/bin
    remote_src: yes

- file:
    path: /usr/local/bin/consul
    state: touch
    mode: "u+x,g+x,o+x"
