---
# This playbook will Setup and install consul for server * 3 and all relevant Consul agents

- name: Install Consul Servers
  hosts: tag_ConsulPrefixForAnsible_ConsulServer_*
  become: true
  remote_user: ubuntu
  vars:
    CONSUL_TEMPLATE_FILE_TYPE: "consul_server"
  roles:
    - role: consul

- name: Install Consul for Jenkins server
  hosts: tag_Purpose_JenkinsSrv
  become: true
  remote_user: ubuntu
  vars:
    CONSUL_TEMPLATE_FILE_TYPE: "consul_agent"
    SERVICE_NAME: "Jenkins-Server"
    SERVICE_TAGS: "jenkins"
    HEALTH_CHECKER_PORT: 8080
  roles:
    - role: consul

- name: Install Consul for Jenkins slave
  hosts: tag_Purpose_JenkinsSlave
  become: true
  remote_user: ubuntu
  vars:
    CONSUL_TEMPLATE_FILE_TYPE: "consul_agent"
    SERVICE_NAME: "Jenkins-Slave"
    SERVICE_TAGS: "jenkins"
    HEALTH_CHECKER_PORT: 22
  roles:
    - role: consul

- name: Install Consul for Bastion
  hosts: tag_Purpose_Bastion
  become: true
  remote_user: ubuntu
  vars:
    CONSUL_TEMPLATE_FILE_TYPE: "consul_agent"
    SERVICE_NAME: "Bastion"
    SERVICE_TAGS: "Bastion"
    HEALTH_CHECKER_PORT: 22
  roles:
    - role: consul

- name: Install Consul for ELK
  hosts: tag_Purpose_ELKSrv
  become: true
  remote_user: ubuntu
  vars:
    CONSUL_TEMPLATE_FILE_TYPE: "consul_agent"
    SERVICE_NAME: "ELK"
    SERVICE_TAGS: "ELK"
    HEALTH_CHECKER_PORT: 5601
  roles:
    - role: consul
