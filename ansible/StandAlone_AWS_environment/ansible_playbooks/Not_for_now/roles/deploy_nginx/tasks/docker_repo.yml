---
- name: Add docker apt repo on {{ ansible_distribution }}
  apt_repository:
    repo: "{{ docker_url_repo[ansible_distribution] }}"
    state: present
  when: ansible_distribution == 'Ubuntu'
  register: repo

- name: Add Docker repo on {{ ansible_distribution }}
  yum_repository:
    name: docker
    description: repo for docker on {{ ansible_distribution }}
    baseurl: "{{ docker_url_repo[ansible_distribution] }}"
    state: present
    gpgcheck: yes
  when: ansible_distribution == 'RedHat'
  register: repo
