---
- name: Create home directory for user on {{ ansible_distribution }}
  file:
    name: "{{ item }}"
    path: "/home/{{ item }}"
    state: directory
  with_items: "{{ user_list[ansible_distribution] }}"

- name: Add group 'docker_grp' to remote server on {{ ansible_distribution }}
  group:
    name: docker_grp
    gid: 2022
    state: present

- name: Add user to remote server on {{ ansible_distribution }}
  user:
    name: "{{ item }}"
    password: "{{ 'docker' | password_hash('sha512') }}"
    home: /home/{{ item }}
    comment: "{{ item }} User"
    group: docker_grp
    shell: /bin/bash
  with_items: "{{ user_list[ansible_distribution] }}"
