---
plugin: aws_ec2

regions:
  - eu-central-1
filters:
  tag:Name:
    - Kandula Ansible_MidPrj WebServer *_*
  instance-state-name: running
keyed_groups:
  - key: tags
    prefix: tag
  - prefix: instance_type
    key: instance_type
  - key: placement.region
    prefix: aws_region
compose:
  ansible_host: private_ip_address
