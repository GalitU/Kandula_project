---
- name: Prerouting Forward port 53 to 8600
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    in_interface: eth0
    protocol: "{{ item }}"
    match: "{{ item }}"
    destination_port: "53"
    jump: REDIRECT
    to_ports: "8600"
    comment: Redirect DNS traffic to port 8600 of consul
  loop:
    - tcp
    - udp

- name: Otput Forward port 53 to 8600
  ansible.builtin.iptables:
    table: nat
    chain: OUTPUT
    protocol: "{{ item }}"
    match: "{{ item }}"
    destination: localhost
    destination_port: "53"
    jump: REDIRECT
    to_ports: "8600"
  loop:
    - tcp
    - udp
