global:
  enabled: false
  image: "hashicorp/consul:1.11.5"
  datacenter: annaops
  gossipEncryption:
    secretName: consul-gossip-encryption-key
    secretKey: key

client:
  enabled: true
  join:
    - "provider=aws tag_key=consul_server tag_value=true"
  exposeGossipPorts: true
dns:
  enabled: true

syncCatalog:
  enabled: true
