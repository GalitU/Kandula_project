# Available parameters and their default values for the Consul chart.

# Holds values that affect multiple components of the chart.
global:
  enabled: false
  image: "hashicorp/consul:1.12.0"
  datacenter: galit_dc_kandula
  gossipEncryption:
    secretName: consul-gossip-encryption-key
    secretKey: key

client:
  enabled: true
  join:
    - "provider=aws tag_key=ConsulAppDiscoveryTag tag_value=Consul"
  nodeMeta:
      pod-name: ${HOSTNAME}
      host-ip: ${HOST_IP}
  exposeGossipPorts: true
dns:
  enabled: true

syncCatalog:
  enabled: true
